name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - release
          - debug
        default: release
      submit_to_play_store:
        description: 'Submit to Play Store after build'
        required: true
        type: boolean
        default: false
      create_release:
        description: 'Create GitHub Release with artifacts'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: 🏗 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Setup Expo
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Decode Keystore
        if: ${{ inputs.build_type == 'release' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: 🚀 Build Android Release
        if: ${{ inputs.build_type == 'release' }}
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 🚀 Build Android Debug
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: android
        run: ./gradlew assembleDebug

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.build_type }}-apk
          path: android/app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          retention-days: 30

      - name: 📦 Upload AAB Artifact
        if: ${{ inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: 🏷️ Get version from package.json
        if: ${{ inputs.create_release }}
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 📝 Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: android-v${{ steps.package_version.outputs.version }}-${{ github.run_number }}
          name: Android Release v${{ steps.package_version.outputs.version }} (Build ${{ github.run_number }})
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/${{ inputs.build_type }}/*.apk
            android/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📲 Submit to Play Store
        if: ${{ inputs.submit_to_play_store && inputs.build_type == 'release' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.yourcompany.activitymobile
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

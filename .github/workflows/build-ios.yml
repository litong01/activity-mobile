name: Build iOS

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build configuration'
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Debug
      create_release:
        description: 'Create GitHub Release with artifacts'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Setup Expo
        run: npx expo prebuild --platform ios --clean

      - name: 🍎 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📦 Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: 🚀 Build iOS app
        working-directory: ios
        run: |
          xcodebuild clean archive \
            -workspace activitymobile.xcworkspace \
            -scheme activitymobile \
            -configuration ${{ inputs.build_type }} \
            -archivePath ./build/activitymobile.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: 📦 Export archive
        working-directory: ios
        run: |
          mkdir -p ./build/app
          cp -R ./build/activitymobile.xcarchive/Products/Applications/*.app ./build/app/

      - name: 📦 Create IPA (if Release)
        if: ${{ inputs.build_type == 'Release' }}
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R ./build/app/*.app ./Payload/
          zip -r activitymobile.ipa Payload
          rm -rf Payload

      - name: 📦 Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.build_type }}-app
          path: ios/build/app/*.app
          retention-days: 30

      - name: 📦 Upload IPA Artifact
        if: ${{ inputs.build_type == 'Release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ios/activitymobile.ipa
          retention-days: 30

      - name: 🏷️ Get version from package.json
        if: ${{ inputs.create_release }}
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 📝 Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ios-v${{ steps.package_version.outputs.version }}-${{ github.run_number }}
          name: iOS ${{ inputs.build_type }} v${{ steps.package_version.outputs.version }} (Build ${{ github.run_number }})
          draft: false
          prerelease: ${{ inputs.build_type == 'Debug' }}
          files: |
            ios/activitymobile.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
